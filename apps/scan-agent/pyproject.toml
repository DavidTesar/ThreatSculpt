[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threatsculpt-scan-agent"
version = "2.0.0"
description = "ThreatSculpt v2 on-prem scan agent: polls the control plane, runs nmap locally, submits observations."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
threatsculpt-agent = "threatsculpt_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/threatsculpt_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:threatsculpt_agent.*"]

[tool.coverage.run]
source = ["threatsculpt_agent"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RET", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# E501: test fixtures embed real nmap XML, which has long lines by nature.
"tests/*" = ["S", "B008", "E501"]

[tool.mypy]
python_version = "3.13"
packages = ["threatsculpt_agent"]
strict = true
warn_unreachable = true

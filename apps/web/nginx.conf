# Serves the built SPA and proxies /api to the control plane.
#
# Proxying rather than pointing the browser straight at the API keeps the
# refresh cookie same-origin, which is what lets it stay HttpOnly + SameSite=Lax
# without a CORS credential exemption.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Belt and braces alongside the control plane's own headers; a static bundle
    # served by nginx never passes through that middleware.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed asset filenames are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://control-plane:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report generation is async, but uploads and large result reads are not.
        proxy_read_timeout 120s;
        client_max_body_size 12m;
    }

    # index.html must never be cached, or a deploy leaves clients on a stale bundle
    # that references asset hashes which no longer exist.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

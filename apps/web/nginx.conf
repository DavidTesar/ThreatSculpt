# Serves the built SPA and proxies /api to the control plane.
#
# Proxying rather than pointing the browser straight at the API keeps the
# refresh cookie same-origin, which is what lets it stay HttpOnly + SameSite=Lax
# without a CORS credential exemption.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # These are the ONLY security headers the browser ever sees: the control plane
    # sets none of its own, and a static bundle served from here never passes through
    # any application middleware.
    #
    # The include is repeated in every location on purpose — see the file itself for
    # why declaring it once here would silently protect nothing but /api.
    include conf.d/security-headers.inc;

    # Hashed asset filenames are safe to cache forever.
    location /assets/ {
        include conf.d/security-headers.inc;
        # One Cache-Control, not two. `expires 1y` plus an `add_header Cache-Control`
        # emitted both, and which one a cache honours is not worth finding out.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        include conf.d/security-headers.inc;
        proxy_pass http://control-plane:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report generation is async, but uploads and large result reads are not.
        proxy_read_timeout 120s;
        client_max_body_size 12m;
    }

    # index.html must never be cached, or a deploy leaves clients on a stale bundle
    # that references asset hashes which no longer exist.
    location / {
        include conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

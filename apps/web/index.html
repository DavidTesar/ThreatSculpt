<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="ThreatSculpt translates vulnerability scan output into business impact — which services are exposed, and what it costs."
    />
    <title>ThreatSculpt</title>
    <script>
      // Applies the stored theme before first paint, so a dark-mode user never sees a
      // white flash on load. Kept inline and tiny for that reason.
      (function () {
        try {
          var stored = localStorage.getItem('ts.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

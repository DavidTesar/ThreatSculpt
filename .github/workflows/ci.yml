name: CI

on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  control-plane:
    name: Control plane
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: threatsculpt
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: threatsculpt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: apps/control-plane
    env:
      DATABASE_URL: postgresql+psycopg://threatsculpt:ci-only-not-a-real-secret@localhost:5432/threatsculpt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy .
      - name: Migrations apply and roll back cleanly
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  scan-agent:
    name: Scan agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scan-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y nmap
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy .
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - run: npm run test -- --run
      - run: npm run build

  e2e:
    name: End-to-end (control plane + agent + nmap + postgres)
    runs-on: ubuntu-latest
    # Runs the three apps against each other for real: real HTTP, real agent
    # enrollment, real nmap against loopback, real ingest, real dashboard reads.
    # deploy/e2e.sh asserts at every step and exits non-zero on the first failure,
    # so this job fails when the apps stop interoperating.
    needs: [control-plane, scan-agent]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install nmap and the postgres client
        run: sudo apt-get update && sudo apt-get install -y nmap postgresql-client jq

      - name: Grant nmap raw-socket capability
        # The agent must not run as root (AGENT-PROTOCOL.md), so the capability
        # goes on the binary. On Debian /usr/bin/nmap may be a wrapper script,
        # so resolve to the real ELF first.
        run: |
          NMAP_BIN="$(readlink -f "$(command -v nmap)")"
          if [ -x /usr/lib/nmap/nmap ]; then NMAP_BIN=/usr/lib/nmap/nmap; fi
          sudo setcap cap_net_raw,cap_net_admin,cap_net_bind_service+eip "$NMAP_BIN"
          getcap "$NMAP_BIN"

      - name: Install both applications
        run: |
          python -m venv apps/control-plane/.venv
          apps/control-plane/.venv/bin/pip install -e apps/control-plane
          python -m venv apps/scan-agent/.venv
          apps/scan-agent/.venv/bin/pip install -e apps/scan-agent

      - name: End-to-end
        run: deploy/e2e.sh

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r apps/control-plane/requirements.txt || true
          pip-audit -r apps/scan-agent/requirements.txt || true

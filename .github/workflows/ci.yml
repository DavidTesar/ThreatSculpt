name: CI

on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  control-plane:
    name: Control plane
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: threatsculpt
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: threatsculpt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: apps/control-plane
    env:
      DATABASE_URL: postgresql+psycopg://threatsculpt:ci-only-not-a-real-secret@localhost:5432/threatsculpt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/control-plane/requirements-dev.lock
      # --require-hashes makes pip reject anything not pinned to a hash in the lock,
      # so what CI tests is byte-identical to what a release installs. The app itself
      # goes in separately and --no-deps: its dependencies come from the lock, never
      # from a fresh resolution of pyproject.toml.
      - name: Install pinned dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Install the application
        run: pip install -e . --no-deps
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy .
      - name: Migrations apply and roll back cleanly
        # This step checks the **schema**: that every migration applies, rolls back, and
        # re-applies. It does not check that grants land, and this postgres service has
        # only the `postgres` role, so 0003 would refuse — deliberately, because an
        # operator who migrates without the application role gets an app with no
        # privileges and "fixes" it by pointing at a superuser DSN, which silently
        # disables RLS. `-x allow_missing_role=1` is that migration's own documented
        # opt-out for exactly this case: it skips the grants and nothing else.
        #
        # It must NOT spread to the Tests step below. That suite exercises RLS as the
        # unprivileged role and its conftest creates the role itself; if it ever needs
        # this flag, the isolation guarantee has broken and the failure is the signal.
        run: |
          alembic -x allow_missing_role=1 upgrade head
          alembic -x allow_missing_role=1 downgrade base
          alembic -x allow_missing_role=1 upgrade head
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  scan-agent:
    name: Scan agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scan-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/scan-agent/requirements-dev.lock
      - run: sudo apt-get update && sudo apt-get install -y nmap
      - name: Install pinned dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Install the application
        run: pip install -e . --no-deps
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy .
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type check
        # `tsc -b`, not a bare `tsc --noEmit`. tsconfig.json is a solution file with
        # `"files": []` and two project references, so `tsc --noEmit` resolved zero
        # input files and passed unconditionally — it reported success on a tree that
        # `npm run build` refused to compile.
        run: npx tsc -b --noEmit
      - run: npm run test -- --run
      - run: npm run build

  api-contract:
    name: API contract (schema and generated types are current)
    runs-on: ubuntu-latest
    # The gate this whole job exists for: the web client's types are generated from the
    # control plane's own OpenAPI schema, so a backend change that alters a response shape
    # has to turn CI red here rather than surprise a customer at runtime. Regenerating and
    # diffing is the check — if either the schema or the generated types differ from what
    # is committed, `git diff --exit-code` fails and the change has to be regenerated and
    # reviewed like any other.
    #
    # No database service: `create_app()` wires routes without opening a connection, and
    # the lifespan handler that does never runs here.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/control-plane/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the control plane
        # Runtime lock only — dumping the schema needs no test tooling. The venv path is
        # the one `npm run openapi:dump` expects.
        run: |
          python -m venv apps/control-plane/.venv
          apps/control-plane/.venv/bin/pip install --require-hashes -r apps/control-plane/requirements.lock
          apps/control-plane/.venv/bin/pip install -e apps/control-plane --no-deps

      - name: Install the web toolchain
        working-directory: apps/web
        run: npm ci

      - name: Regenerate and fail on drift
        working-directory: apps/web
        run: npm run openapi:check

      - name: What drifted
        if: failure()
        working-directory: apps/web
        run: |
          echo "::error::The committed OpenAPI schema or generated types are stale."
          echo "Run 'npm run openapi' in apps/web and commit the result."
          git --no-pager diff -- openapi.json src/lib/api/schema.gen.ts

  web-image:
    name: Web image and security headers
    runs-on: ubuntu-latest
    # Nothing else in this workflow ever runs nginx.conf. The `web` job builds the
    # bundle but never serves it, so the whole serving layer — the Dockerfile and the
    # nginx config — shipped untested. That is how the SPA came to be served with none
    # of its security headers while the config file plainly listed them: the headers
    # were declared once at server level, which nginx does not inherit into a location
    # that declares its own add_header, and both SPA locations do.
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t threatsculpt-web:ci apps/web
      - name: Start it
        # On a user-defined network, deliberately, and with **no control plane on it**.
        # Two things are under test at once:
        #
        #  1. The container must start at all with its upstream absent. It did not use
        #     to: a literal `proxy_pass http://control-plane:8000` is resolved once at
        #     startup and nginx hard-fails with `host not found in upstream`, so a
        #     backend that is down, restarting, or merely slower to come up took the
        #     whole dashboard with it. The upstream is now a variable (see
        #     apps/web/upstream.inc), which defers resolution to request time.
        #  2. A user-defined network is what `docker compose` creates, and it is the
        #     only place Docker's embedded DNS at 127.0.0.11 exists — the resolver the
        #     shipped config points at. A bare `docker run` would exercise a resolver
        #     address that is not there, which is a different failure from the one
        #     production would hit.
        run: |
          docker network create ts-ci
          docker run -d --name web --network ts-ci -p 8080:8080 threatsculpt-web:ci
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          echo "the web container never became ready"
          docker logs web
          exit 1
      # No control plane on the network, so /api/ answers 502 — which is the point:
      # `always` means the headers have to be present on error responses too, and the
      # SPA has to keep serving while the API is unreachable.
      - name: Security headers on every route class
        run: apps/web/check-security-headers.sh http://127.0.0.1:8080
      - name: Container logs on failure
        if: failure()
        run: docker logs web

  e2e:
    name: End-to-end (control plane + agent + nmap + postgres)
    runs-on: ubuntu-latest
    # Runs the three apps against each other for real: real HTTP, real agent
    # enrollment, real nmap against loopback, real ingest, real dashboard reads.
    # deploy/e2e.sh asserts at every step and exits non-zero on the first failure,
    # so this job fails when the apps stop interoperating.
    needs: [control-plane, scan-agent]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/control-plane/requirements.lock
            apps/scan-agent/requirements.lock

      - name: Install nmap and the postgres client
        run: sudo apt-get update && sudo apt-get install -y nmap postgresql-client jq

      - name: Grant nmap raw-socket capability
        # The agent must not run as root (AGENT-PROTOCOL.md), so the capability
        # goes on the binary. On Debian /usr/bin/nmap may be a wrapper script,
        # so resolve to the real ELF first.
        run: |
          NMAP_BIN="$(readlink -f "$(command -v nmap)")"
          if [ -x /usr/lib/nmap/nmap ]; then NMAP_BIN=/usr/lib/nmap/nmap; fi
          sudo setcap cap_net_raw,cap_net_admin,cap_net_bind_service+eip "$NMAP_BIN"
          getcap "$NMAP_BIN"

      - name: Install both applications
        # Runtime locks only — the end-to-end run needs neither app's dev tooling.
        run: |
          python -m venv apps/control-plane/.venv
          apps/control-plane/.venv/bin/pip install --require-hashes -r apps/control-plane/requirements.lock
          apps/control-plane/.venv/bin/pip install -e apps/control-plane --no-deps
          python -m venv apps/scan-agent/.venv
          apps/scan-agent/.venv/bin/pip install --require-hashes -r apps/scan-agent/requirements.lock
          apps/scan-agent/.venv/bin/pip install -e apps/scan-agent --no-deps

      - name: End-to-end
        run: deploy/e2e.sh

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Nothing in this job may swallow a non-zero exit. An audit that cannot fail is
    # worse than no audit: it reads as coverage on the dashboard while auditing
    # nothing, which is exactly how a `pip-audit -r <file that never existed> || true`
    # survived here unnoticed. To accept a specific advisory, add
    # `--ignore-vuln GHSA-xxxx` with a comment saying why it is not reachable —
    # never `|| true`, and never by raising the severity threshold.
    steps:
      - uses: actions/checkout@v4
      # No dependency cache: this job never installs anything. `npm audit` reads
      # package-lock.json and queries the registry directly.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # moderate, not high. Every advisory this project has actually had was
      # moderate, so --audit-level=high walked straight past all of them.
      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=moderate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pip-audit
        # Audits the lockfiles, which are the versions that actually get installed.
        #   --no-deps  the locks are complete and fully pinned, so audit exactly them
        #              rather than letting pip-audit re-resolve a different set
        #   --strict   fail when a package cannot be audited, instead of skipping it
        #              and reporting success
        run: |
          pip install pip-audit==2.10.1
          for lock in apps/control-plane/requirements.lock \
                      apps/control-plane/requirements-dev.lock \
                      apps/scan-agent/requirements.lock \
                      apps/scan-agent/requirements-dev.lock; do
            echo "::group::pip-audit $lock"
            pip-audit --strict --no-deps -r "$lock"
            echo "::endgroup::"
          done
